<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Teams">
<meta name="theme-color" content="#0b1220">
<title>My Teams</title>
<style>
:root{--bg:#0b1220;--card:#151e30;--card2:#1b2640;--line:rgba(255,255,255,.07);--text:#f1f5f9;--dim:#8b9ab3;--w:#34d399;--l:#f87171}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:radial-gradient(900px 400px at 50% -100px,#1e3a8a55,transparent),var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;padding:max(20px,env(safe-area-inset-top)) 16px 40px;-webkit-font-smoothing:antialiased}
main{max-width:520px;margin:0 auto}
header{display:flex;justify-content:flex-start;align-items:flex-end;margin:6px 2px 18px}
h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:0}
.sub{color:var(--dim);font-size:12px;line-height:1.3}
.dim{color:var(--dim)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;margin-bottom:14px;overflow:hidden;animation:rise .45s both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.today{padding:14px 16px}
.label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:8px}
.item{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-weight:600}
.item+.item{border-top:1px solid var(--line)}
.item .t{font-variant-numeric:tabular-nums;color:#fff}
.team{border-top:3px solid var(--c)}
.head{display:flex;align-items:center;gap:12px;padding:16px 16px 12px}
.badge{width:40px;height:40px;border-radius:12px;background:color-mix(in srgb,var(--c) 22%,transparent);display:grid;place-items:center;font-size:21px;flex:none}
.head h3{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.meta{font-size:12.5px;color:var(--dim);margin-top:1px}
.rec{margin-left:auto;font-weight:800;font-size:15px;background:var(--card2);border-radius:10px;padding:5px 10px;font-variant-numeric:tabular-nums;white-space:nowrap}
.games{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 14px}
.games.one{grid-template-columns:1fr}
.g{background:var(--card2);border-radius:14px;padding:11px 12px;min-width:0}
.g .k{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);display:flex;justify-content:space-between;align-items:center}
.g .opp{font-weight:700;font-size:15px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g .sc{font-size:22px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.g .sc small{font-size:13px;font-weight:700;margin-right:6px}
.g .when{font-size:12.5px;color:var(--dim);margin-top:3px}
.W{color:var(--w)}.L{color:var(--l)}
.live{background:#ef4444;color:#fff;border-radius:5px;padding:1px 6px;font-size:10px;font-weight:800;letter-spacing:.06em;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.55}}
.newsbox{border-top:1px solid var(--line);padding:4px 16px 8px}
.news a{display:block;color:var(--text);text-decoration:none;font-size:13.5px;line-height:1.35;padding:9px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.news+.news a{border-top:1px solid var(--line)}
.news a:active{color:var(--c)}
</style>
</head>
<body>
<main>
  <header><div class="sub"><span id="day"></span><br><span id="upd"></span></div></header>
  <div id="teams"></div>
</main>
<script>
const $ = id => document.getElementById(id);

const TEAMS=[
  {name:"Tennessee Titans",color:"#4B92DB",emoji:"🏈",path:"football/nfl",id:10},
  {name:"UNC Basketball",color:"#7BAFD4",emoji:"🏀",path:"basketball/mens-college-basketball",id:153},
  {name:"UNC Football",color:"#7BAFD4",emoji:"🏈",path:"football/college-football",id:153},
  {name:"Carolina Hurricanes",color:"#e0303a",emoji:"🏒",path:"hockey/nhl",id:7},
  {name:"Colorado Rockies",color:"#8b5cf6",emoji:"⚾",path:"baseball/mlb",id:27},
];
const ESPN="https://site.api.espn.com/apis/site/v2/sports/";
let DATA=null;
async function loadData(){const r=await fetch("data.json?t="+Date.now());if(!r.ok)throw new Error("data "+r.status);DATA=await r.json();}
const TZ="America/Denver";
const nm=t=>t.shortDisplayName||t.displayName||t.abbreviation;
const when=d=>new Date(d).toLocaleString(undefined,{timeZone:TZ,weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit",timeZoneName:"short"});
const dkey=d=>new Date(d).toLocaleDateString("en-CA",{timeZone:TZ});
const sameDay=d=>dkey(d)===dkey(new Date());
function parse(e,id){
  const c=e.competitions[0],me=c.competitors.find(x=>String(x.team.id)==String(id)),op=c.competitors.find(x=>x!==me);
  const st=c.status.type,sc=x=>x&&x.score?(x.score.displayValue??x.score):"";
  const tv=(c.broadcasts||[]).map(b=>b.media&&b.media.shortName).filter(Boolean)[0];
  return {date:e.date,state:st.state,detail:st.shortDetail,me,op,home:me.homeAway==="home",ms:sc(me),os:sc(op),win:me.winner,tv,opName:nm(op.team)};
}
async function teamData(t){
  const dd=(DATA.teams||{})[t.path+"/"+t.id]||{};
  const games=(dd.events||[]).map(e=>parse(e,t.id));
  const live=games.find(g=>g.state==="in");
  const past=games.filter(g=>g.state==="post").pop();
  const next=games.find(g=>g.state==="pre");
  const team=dd.team||{};
  const rec=team.recordSummary||"";
  const news=dd.articles||[];
  return {t,live,past,next,rec,news,standing:team.standingSummary||""};
}
const vs=g=>(g.home?"vs ":"@ ")+g.opName;
const fd=d=>new Date(d).toLocaleDateString(undefined,{timeZone:TZ,month:"short",day:"numeric"});
function card(d){
  const tile=(k,body)=>`<div class="g">${k}${body}</div>`;
  const tiles=[];
  if(d.live)tiles.push(tile(`<div class="k"><span class="live">LIVE</span><span>${d.live.detail}</span></div>`,`<div class="opp">${vs(d.live)}</div><div class="sc">${d.live.ms}–${d.live.os}</div>`));
  if(d.past)tiles.push(tile(`<div class="k"><span>Last</span><span>${fd(d.past.date)}</span></div>`,`<div class="opp">${vs(d.past)}</div><div class="sc"><small class="${d.past.win?"W":"L"}">${d.past.win?"W":"L"}</small>${d.past.ms}–${d.past.os}</div>`));
  if(d.next)tiles.push(tile(`<div class="k"><span>Next</span>${d.next.tv?`<span>${d.next.tv}</span>`:""}</div>`,`<div class="opp">${vs(d.next)}</div><div class="when">${when(d.next.date)}</div>`));
  else if(!d.live)tiles.push(tile(`<div class="k"><span>Next</span></div>`,`<div class="opp dim">Nothing scheduled</div><div class="when">Check back later</div>`));
  const news=d.news.slice(0,3).map(a=>`<div class="news"><a href="${a.links&&a.links.web?a.links.web.href:"#"}" target="_blank" rel="noopener">${a.headline}</a></div>`).join("");
  return `<section class="card team" style="--c:${d.t.color}"><div class="head"><div class="badge">${d.t.emoji}</div><div><h3>${d.t.name}</h3>${d.standing?`<div class="meta">${d.standing}</div>`:""}</div>${d.rec?`<div class="rec">${d.rec}</div>`:""}</div><div class="games${tiles.length<2?" one":""}">${tiles.join("")}</div>${news?`<div class="newsbox">${news}</div>`:""}</section>`;
}
let teamsTimer=null;
async function showTeams(){
  const el=$("teams");
  if(!el.innerHTML)el.innerHTML='<div class="card today dim">Loading teams…</div>';
  await loadData();
  const all=await Promise.all(TEAMS.map(teamData));
  const todays=[];
  all.forEach(d=>[d.live,d.next,d.past].forEach(g=>{if(g&&sameDay(g.date)&&!todays.some(x=>x.g===g))todays.push({d,g})}));
  todays.sort((a,b)=>new Date(a.g.date)-new Date(b.g.date));
  const tcard=todays.length?`<div class="card today"><div class="label">Today</div>${todays.map(({d,g})=>`<div class="item"><span>${d.t.emoji} ${d.t.name} <span class="dim">${vs(g)}</span></span><span class="t">${g.state==="pre"?new Date(g.date).toLocaleTimeString(undefined,{timeZone:TZ,hour:"numeric",minute:"2-digit"}):g.state==="in"?'<span class="live">LIVE</span> '+g.ms+"–"+g.os:g.ms+"–"+g.os+" F"}</span></div>`).join("")}</div>`:"";
  el.innerHTML=tcard+all.map(card).join("");
  $("day").textContent=new Date().toLocaleDateString(undefined,{timeZone:TZ,weekday:"long",month:"short",day:"numeric"});
  const u=$("upd");if(u&&DATA.updated)u.textContent="Updated "+new Date(DATA.updated).toLocaleTimeString(undefined,{timeZone:TZ,hour:"numeric",minute:"2-digit"});
  clearTimeout(teamsTimer);
  teamsTimer=setTimeout(showTeams,1800000);
}

showTeams().catch(e=>{$("teams").innerHTML='<div class="card dim">Couldn\'t load: '+e.message+'</div>'});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)showTeams()});
</script>
</body>
</html>
